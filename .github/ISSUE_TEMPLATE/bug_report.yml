name: Bug report
description: Report something that does not work as documented.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A minimal reproduction is worth more than a long description. If the
        project has a known-good setup, say which version or commit you used.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, including the full error output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a clean checkout.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, version, runtime versions, anything else relevant.
    validations:
      required: false
